syntax = "proto3";

import "buffer.proto";

package api;

// A copy of protos/api.proto, reduced to the messages of the Random service.

message Clause {
    repeated int32 literal = 1;
}

message Cnf {
    repeated Clause clause = 1;
}

service Random {
    rpc RandomCnf(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Empty -> Cnf
}
