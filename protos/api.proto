syntax = "proto3";

import "solvers_dataset.proto";
import "buffer.proto";

package api;

// Solver

// An interpretation is a list of signed literals that are true.
// An UNSAT answer is satisfiable = false (or no field set and an empty list).
// A SAT answer has the literals. It can also set satisfiable = true. This is
// necessary for a CNF without variables.
// An interpretation with literals and satisfiable = false is not valid.
message Interpretation {
    repeated int32 variable = 1;
    optional bool satisfiable = 2;
}


// Random
message Clause {
    repeated int32 literal = 1;
}

message Cnf {
    repeated Clause clause = 1;
}

message File {
    string file = 1;
}

// The model of each solver configuration. Like regresion.Tensor, but each
// element is the full solver configuration, not only its id.
message Tensor {
    message NonEscalarDimension {
        message NonEscalar {
            dataset.SolverConfiguration element = 1;
            oneof model {
                bytes escalar = 2;  // A serialized onnx.ModelProto.
                NonEscalarDimension non_escalar = 3;
            }
        }
        repeated NonEscalar non_escalar = 1;
    }
    // Field 1 was celaut.Service.Tensor. The current celaut.proto does not
    // have this message.
    reserved 1;
    oneof model {
        bytes escalar = 2;  // A serialized onnx.ModelProto.
        NonEscalarDimension non_escalar = 3;
    }
}

service Solver {
    rpc StartTrain ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> Empty
    rpc StopTrain ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> Empty
    rpc GetTensor ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> Tensor
    rpc UploadSolver ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // 1: celaut.Metadata, 2: celaut.Service -> Empty
    rpc StreamLogs ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> stream of File
    rpc Solve ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Cnf -> 1: Interpretation, 2: Empty
    rpc AddTensor( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Tensor -> Empty (not implemented)

    // Until AddTensor is implemented.
    rpc GetDataSet ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> dataset.DataSet
    rpc AddDataSet ( stream buffer.Buffer) returns (stream buffer.Buffer) {}  // dataset.DataSet -> Empty
}

service Random {
    rpc RandomCnf(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Empty -> Cnf
}
