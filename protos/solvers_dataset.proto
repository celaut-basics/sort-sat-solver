syntax = "proto3";

package dataset;

// The training data. dependencies/regresion_cnf/solvers_dataset.proto must be
// identical to this file. tests/test_protos.py checks this.

// The mean score of a solver configuration for one CNF shape.
message Data {
    float score = 1;  // The mean score. A higher score is better.
    int32 index = 2;  // The number of samples in the mean.
}

message DataSetInstance {
    bytes configuration_hash = 1;  // The id of the solver configuration (api.SolverConfiguration).
    bytes service_hash = 2;  // The SHA3-256 id of the solver service.
    map<string, Data> data = 3;  // The key is a CNF shape: "<clauses>:<variables>".
}

message DataSet {
    // One instance for each solver configuration.
    repeated DataSetInstance data = 1;
}
