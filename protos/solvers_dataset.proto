syntax = "proto3";

import "celaut.proto";

package dataset;

// The mean score of a solver configuration for one CNF shape.
message Data {
    float score = 1;  // Mean score. Higher is better.
    int32 index = 2;  // Number of samples in the mean.
}

message SolverConfiguration {
    celaut.Metadata meta = 1;
    // Was map<string, bytes> enviroment_variables = 2. The wire format is the same.
    repeated celaut.BytesKeyValue environment_variables = 2;
}

message DataSetInstance {
    bytes configuration_hash = 1;  // SHA3-256 of the SolverConfiguration.
    bytes service_hash = 2;  // SHA3-256 id of the solver service.
    map<string, Data> data = 3;  // The key is a CNF shape: "<clauses>:<variables>".
}

message DataSet {
    // One instance for each solver configuration.
    repeated DataSetInstance data = 1;
}
