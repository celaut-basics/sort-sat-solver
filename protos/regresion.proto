syntax = "proto3";

import "buffer.proto";

// The API of the regression service (dependencies/regresion_cnf).
// dependencies/regresion_cnf/regresion.proto must be identical to this file.
// tests/test_protos.py checks this.

message File {
    string file = 1;
}

// The model of each solver configuration. Each element is the id of a solver
// configuration: the hex of DataSetInstance.configuration_hash. Each escalar
// is a serialized ONNX model (see api.Tensor).
message Tensor {
    message NonEscalarDimension {
        message NonEscalar {
            string element = 1;
            oneof model {
                bytes escalar = 2;
                NonEscalarDimension non_escalar = 3;
            }
        }
        repeated NonEscalar non_escalar = 1;
    }
    oneof model {
        bytes escalar = 1;
        NonEscalarDimension non_escalar = 2;
    }
}

service Regresion {
    rpc StreamLogs (stream buffer.Buffer) returns (stream buffer.Buffer) {}  // Empty -> File
    rpc MakeRegresion (stream buffer.Buffer) returns (stream buffer.Buffer) {}  // dataset.DataSet -> Tensor
}
